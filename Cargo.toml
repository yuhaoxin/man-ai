[package]
name = "man-ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Translate rendered man pages into a target language"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "socks"] }
toml = "1.2.1"

[dev-dependencies]
portable-pty = "0.9.0"
