[package]
name = "man-ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Translate rendered man pages into a target language"

[dependencies]
async-openai = { version = "0.43", default-features = false, features = ["chat-completion", "rustls", "middleware"] }
futures = "0.3.34"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "socks"] }
signal-hook = "0.4.6"
terminal_size = "0.4.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.2.1"

[dev-dependencies]
axum = "0.8.9"
portable-pty = "0.9.0"
serde_json = "1.0.154"
